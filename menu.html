<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Vita | Our Premium Menu</title>
    
    <!-- Google Fonts ലിങ്കുകൾ (നിങ്ങളുടെ ഡിസൈനിലെ അതേ ഫോണ്ടുകൾ വരാൻ) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f7f3ec !important;
            color: #292621 !important;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 60px 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }
        .menu-header {
            text-align: center;
            margin-bottom: 50px;
        }
        .menu-header p {
            color: #c9a66b;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0;
        }
        .menu-header h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(2.8rem, 5vw, 4.2rem);
            font-weight: 500;
            margin: 15px 0 20px;
            color: #11100e;
        }
        .menu-header .subtitle {
            color: #706b63;
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 60px;
        }
        .menu-btn {
            padding: 12px 28px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            background: transparent;
            color: #706b63;
            transition: all 0.2s ease;
        }
        /* Active ബട്ടൺ സ്റ്റൈൽ */
        .menu-btn.active {
            background-color: #11100e !important;
            color: #ffffff !important;
            border-color: #11100e !important;
        }
        .menu-btn:hover:not(.active) {
            background-color: rgba(0,0,0,0.03);
            color: #11100e;
        }

        /* 100% സ്ഥിരതയുള്ള 2-Column ഗ്രിഡ് ലേഔട്ട് */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            column-gap: 60px;
            row-gap: 35px;
        }
        
        /* ഓരോ വിഭവത്തിന്റെയും സ്റ്റൈൽ */
        .menu-item {
            border-bottom: 1px solid #e6dfd5;
            padding-bottom: 25px;
            animation: fadeInMenu 0.4s ease-in-out forwards;
        }
        .menu-item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .menu-item h3 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.45rem;
            font-weight: 500;
            margin: 0;
            color: #11100e;
        }
        .menu-item .price {
            color: #c9a66b;
            font-weight: 600;
            font-size: 1.05rem;
        }
        .menu-item p {
            color: #8c8579;
            font-size: 0.88rem;
            line-height: 1.5;
            margin: 0;
        }

        /* മൊബൈൽ സ്ക്രീനുകളിൽ ഒറ്റ കോളമായി മാറാൻ */
        @media (max-width: 768px) {
            .menu-grid {
                grid-template-columns: 1fr;
                row-gap: 30px;
            }
        }

        @keyframes fadeInMenu {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="menu-header">
            <p>Our Menu</p>
            <h1>Crafted With Passion.</h1>
            <p class="subtitle">A carefully curated selection of dishes designed to delight every palate.</p>
        </div>

        <!-- ഫിൽട്ടർ ബട്ടണുകൾ -->
        <div class="tab-container">
            <button class="menu-btn active" onclick="filterMenu('starters', this)">Starters</button>
            <button class="menu-btn" onclick="filterMenu('main-course', this)">Main Course</button>
            <button class="menu-btn" onclick="filterMenu('desserts', this)">Desserts</button>
            <button class="menu-btn" onclick="filterMenu('drinks', this)">Drinks</button>
        </div>

        <!-- വിഭവങ്ങൾ ദൃശ്യമാകുന്ന പ്രധാന ഗ്രിഡ് ബോക്സ് -->
        <div id="menu-container-box" class="menu-grid">
            <!-- ജാവാസ്ക്രിപ്റ്റ് വഴി ഇവിടെ ഐറ്റങ്ങൾ തനിയെ ലോഡ് ചെയ്യപ്പെടും -->
        </div>
    </div>

    <script>
        // ഡാറ്റ നഷ്ടപ്പെടാതിരിക്കാൻ എല്ലാ മെനു ഐറ്റങ്ങളും ഒരു സുരക്ഷിത Object ആയി സൂക്ഷിക്കുന്നു
        const fullMenuDatabase = {
            'starters': [
                { name: "Burrata Garden Salad", price: "\$18", desc: "Creamy burrata, heirloom tomatoes, basil and balsamic glaze." },
                { name: "Truffle Arancini", price: "\$16", desc: "Crispy risotto balls with black truffle and parmesan." },
                { name: "Garlic Butter Prawns", price: "\$30", desc: "Succulent prawns with roasted garlic, herbs, and lemon." },
                { name: "Wild Mushroom Bruschetta", price: "\$15", desc: "Toasted sourdough with wild mushrooms and parmesan." }
            ],
            'main-course': [
                { name: "Black Truffle Pasta", price: "\$28", desc: "Handmade pasta, black truffle, parmesan and creamy sauce." },
                { name: "Herb Grilled Salmon", price: "\$32", desc: "Fresh Atlantic salmon with herbs, lemon butter and vegetables." },
                { name: "Prime Ribeye", price: "\$42", desc: "Premium aged ribeye with roasted garlic and rosemary jus." },
                { name: "Wild Mushroom Risotto", price: "\$26", desc: "Arborio rice, wild mushrooms, parmesan and fresh herbs." }
            ],
            'desserts': [
                { name: "Chocolate Fondant", price: "\$14", desc: "Warm dark chocolate cake with vanilla ice cream." },
                { name: "Classic Tiramisu", price: "\$12", desc: "Espresso-soaked mascarpone, cocoa and ladyfingers." },
                { name: "Vanilla Panna Cotta", price: "\$11", desc: "Silky vanilla panna cotta with seasonal berries." },
                { name: "Lemon Tart", price: "\$13", desc: "Classic lemon curd tart with Italian meringue." }
            ],
            'drinks': [
                { name: "La Vita Signature", price: "\$10", desc: "Passion fruit, citrus, mint and sparkling water." },
                { name: "Sparkling Citrus", price: "\$8", desc: "Fresh orange, lemon and sparkling water." },
                { name: "Espresso Martini", price: "\$14", desc: "Espresso with premium vodka and coffee liqueur." },
                { name: "Mineral Water", price: "\$5", desc: "Premium still or sparkling mineral water." }
            ]
        };

        // മെനു സ്ക്രീനിലേക്ക് പ്രിന്റ് ചെയ്യാനുള്ള പ്രധാന ഫങ്ക്ഷൻ
        function filterMenu(category, clickedButton) {
            const displayBox = document.getElementById('menu-container-box');
            
            // 1. ആക്റ്റീവ് ബട്ടൺ സ്റ്റൈൽ മാറ്റുക
            if (clickedButton) {
                document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
                clickedButton.classList.add('active');
            }

            // 2. മുൻപത്തെ ഐറ്റങ്ങൾ ബോക്സിൽ നിന്നും പൂർണ്ണമായി ക്ലിയർ ചെയ്യുക
            displayBox.innerHTML = "";

            // 3. തിരഞ്ഞെടുത്ത കാറ്റഗറിയിലെ മുഴുവൻ വിഭവങ്ങളും ലൂപ്പ് ചെയ്ത് കൃത്യമായി നിർമ്മിക്കുക
            const currentItems = fullMenuDatabase[category];
            
            currentItems.forEach(item => {
                const itemHTML = `
                    <div class="menu-item">
                        <div class="menu-item-header">
                            <h3>${item.name}</h3>
                            <span class="price">${item.price}</span>
                        </div>
                        <p>${item.desc}</p>
                    </div>
                `;
                displayBox.innerHTML += itemHTML;
            });
        }

        // പേജ് ആദ്യമായി ലോഡ് ചെയ്യുമ്പോൾ ഡിഫോൾട്ടായി 'starters' മെനു കാണിക്കാൻ
        window.onload = function() {
            filterMenu('starters', null);
        };
    </script>

</body>
</html>
